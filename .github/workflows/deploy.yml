name: Actualizar precios y publicar

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UTC. Precios de mañana (REE publica ~20:15 hora peninsular) y cambio de día.
    - cron: '45 19 * * *'
    - cron: '30 20 * * *'
    - cron: '30 21 * * *'
    - cron: '5 22 * * *'
    - cron: '5 23 * * *'
    - cron: '0 6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Descargar precios de Red Eléctrica
        run: node scripts/update-prices.mjs
      - name: Guardar histórico en el repositorio
        run: |
          git config user.name "kwhoy-bot"
          git config user.email "bot@kwhoy.es"
          git add src/data/prices.json
          git diff --cached --quiet || (git commit -m "Precios $(date -u +%F)" && git push)
      - name: Construir la web
        run: npm run build
        env:
          PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}
          PUBLIC_AD_SLOT_HOME: ${{ vars.PUBLIC_AD_SLOT_HOME }}
          PUBLIC_AD_SLOT_CALC: ${{ vars.PUBLIC_AD_SLOT_CALC }}
      - name: Ajustar enlaces si aún no hay dominio propio
        run: node scripts/apply-base.mjs
        env:
          # Mientras no exista la variable CUSTOM_DOMAIN, la web vive en usuario.github.io/kwhoy/
          SITE_BASE: ${{ vars.CUSTOM_DOMAIN == '' && format('/{0}', github.event.repository.name) || '' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Avisar a Bing y otros buscadores (IndexNow)
        if: ${{ vars.CUSTOM_DOMAIN != '' }}
        continue-on-error: true
        run: |
          HOY=$(TZ=Europe/Madrid date +%F)
          D=https://${{ vars.CUSTOM_DOMAIN }}
          curl -sS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json' -d "{\"host\":\"${{ vars.CUSTOM_DOMAIN }}\",\"key\":\"f60cbc1d3bdd3e51e9bac71f68ea0613\",\"keyLocation\":\"$D/f60cbc1d3bdd3e51e9bac71f68ea0613.txt\",\"urlList\":[\"$D/\",\"$D/precio-luz-manana/\",\"$D/precio-luz/$HOY/\"]}" -w '%{http_code}\n'

  telegram:
    needs: deploy
    if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[telegram]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar el precio de mañana en Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ vars.TELEGRAM_CHAT }}
        run: node scripts/telegram-post.mjs
      - name: Recordar que ya se ha publicado
        run: |
          git config user.name "kwhoy-bot"
          git config user.email "bot@kwhoy.es"
          git add src/data/telegram.json
          git diff --cached --quiet || (git commit -m "Telegram $(date -u +%F)" && git push)
